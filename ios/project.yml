# The Xcode project for running LeadStinger on a physical iPad (scripts/ios-install.sh
# generates it with xcodegen). Xcode only wraps the Rust build: the Run Script phase calls
# cargo and puts the executable where Xcode expects it, and Xcode then signs the bundle
# with the team's Apple Development identity (automatic signing).
# The team comes from the environment: LEADSTINGER_TEAM (a 10-character team id).
name: LeadStinger
options:
  bundleIdPrefix: io.github.weckere
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${LEADSTINGER_TEAM}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
targets:
  LeadStinger:
    type: application
    platform: iOS
    sources: []
    settings:
      base:
        PRODUCT_NAME: leadstinger
        PRODUCT_BUNDLE_IDENTIFIER: io.github.weckere.leadstinger
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build the Rust app
        script: |
          exec "$SRCROOT/../scripts/ios-xcode-phase.sh"
        basedOnDependencyAnalysis: false
