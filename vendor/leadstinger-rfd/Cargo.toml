[package]
name = "leadstinger-rfd"
version = "0.1.0"
edition = "2021"
description = "rfd's FileDialog on desktop; a UIDocumentPickerViewController-based stand-in on iPadOS"
license = "MIT"
publish = false

[target.'cfg(not(target_os = "ios"))'.dependencies]
rfd-desktop = { package = "rfd", version = "0.15" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSURL", "NSError", "NSRunLoop", "NSDate", "NSObject", "NSEnumerator", "NSFileManager", "NSPathUtilities"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIApplication", "UIResponder", "UIView", "UIViewController", "UIWindow", "UIScene", "UIWindowScene", "UIDocumentPickerViewController", "block2"] }
